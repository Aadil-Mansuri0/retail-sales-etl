name: Retail ETL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile pipeline modules
        run: python -m compileall -q src tests

      - name: Validate imports
        run: python -c "import pandas, numpy, duckdb; print('ETL dependencies imported successfully')"

      - name: Run tests
        run: pytest -q
